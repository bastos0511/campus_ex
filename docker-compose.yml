# CampusDesk completo: PostgreSQL + backend (Spring Boot) + frontend (nginx).
#   docker compose up -d --build
# Frontend: http://localhost:5500 · API: http://localhost:8080/api · Swagger: http://localhost:8080/swagger-ui.html
services:
  postgres:
    image: postgres:16-alpine
    container_name: campusdesk-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: technova_db
      POSTGRES_USER: campusdesk_app
      POSTGRES_PASSWORD: campusdesk_dev
      TZ: UTC
      PGTZ: UTC
    ports:
      - "5432:5432"
    volumes:
      - campusdesk_pgdata:/var/lib/postgresql/data
      # Solo se ejecutan la primera vez (cuando el volumen está vacío), en orden alfabético.
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U campusdesk_app -d technova_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    container_name: campusdesk-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # El resto de la configuración está fija en application.properties.
      DB_URL: jdbc:postgresql://postgres:5432/technova_db
    ports:
      - "8080:8080"

  frontend:
    image: nginx:1.27-alpine
    container_name: campusdesk-frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    # Puerto 5500: es el origen permitido por CORS en el backend.
    ports:
      - "5500:80"

volumes:
  campusdesk_pgdata:
