spring.application.name=campusdesk
server.port=8080

# Database: matches the postgres service in docker-compose.yml.
# Only DB_URL changes inside Docker (host "postgres" instead of localhost).
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/technova_db}
spring.datasource.username=campusdesk_app
spring.datasource.password=campusdesk_dev

# Session runs in UTC so the updated_at trigger matches the dates
# saved by JPA (Hibernate writes Instant in UTC). Without this, updated_at
# would lag 5 hours behind and the updated_at >= created_at CHECK would fail.
spring.datasource.hikari.connection-init-sql=SET TIME ZONE 'UTC'

# Hibernate only VALIDATES the structure on startup (never modifies it).
# database/schema.sql is the single source of truth for tables, columns,
# constraints, indexes and triggers. Verified with ddl-auto=validate.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# JWT: fixed secret (minimum 32 characters). Development project only.
app.jwt.secret=258767d716959fd51ee697b881ab05a2f2baae775b31ad4b2b84cca877b8e688
app.jwt.expiration-minutes=${JWT_EXPIRATION_MINUTES:60}

# CORS: only the frontend origins (comma separated).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# ADMIN and TECHNICIAN accounts created on startup (skipped if they exist).
app.seed.admin-name=Administrador CampusDesk
app.seed.admin-email=admin@campusdesk.com
app.seed.admin-password=Admin96c2b7d5!
app.seed.technician-name=Tecnico CampusDesk
app.seed.technician-email=tecnico@campusdesk.com
app.seed.technician-password=Tecnico3f8a1c6e!

# Auto-close: RESUELTA tickets the requester did not close after N days
# are closed by the system. 0 disables it. Cron: second minute hour day month weekday.
app.tickets.auto-close-days=${AUTO_CLOSE_DAYS:7}
app.tickets.auto-close-cron=${AUTO_CLOSE_CRON:0 0 3 * * *}

# Errors never expose internal messages or traces.
server.error.include-message=never
server.error.include-stacktrace=never
server.error.include-binding-errors=never

# Swagger.
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.persist-authorization=true
